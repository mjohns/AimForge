edition = "2023";

import "scenario.proto";

package aim;

message PlaylistDef {
  repeated PlaylistItem items = 1;
  string description = 2;
  ScenarioLevelsDef scenario_levels_def = 3;
}

message ScenarioLevelsDef {
  string base_scenario = 1;
  ScenarioOverrides scenario_overrides = 2;
  int32 max_level = 3;
  int32 num_plays_per_level = 4;
}

message PlaylistItem {
  string scenario = 1;
  int32 num_plays = 2;
  bool auto_next = 3;
}
